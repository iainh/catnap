[package]
name = "catnap"
description = "A trait-first Rust REST client inspired by Eclipse MicroProfile REST Client."
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
http.workspace = true
percent-encoding.workspace = true
quick-xml = { workspace = true, optional = true }
reqwest.workspace = true
serde.workspace = true
thiserror.workspace = true
url.workspace = true

catnap-macros = { path = "../catnap-macros" }

[features]
default = ["json"]
json = ["reqwest/json"]
xml = ["dep:quick-xml"]

[dev-dependencies]
serde_json.workspace = true
tokio.workspace = true

[[example]]
name = "httpbin_json"
path = "examples/httpbin_json.rs"

[[example]]
name = "httpbin_xml"
path = "examples/httpbin_xml.rs"
required-features = ["xml"]

[[example]]
name = "httpbin_status"
path = "examples/httpbin_status.rs"
